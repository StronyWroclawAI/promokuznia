name = "promokuznia"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

# Baza zamówień i katalogu (Cloudflare D1, utworzona w panelu).
[[d1_databases]]
binding = "DB"
database_name = "promokuznia-db"
database_id = "8a23f9da-15a7-4566-be65-4eaf13e3dbc2"
migrations_dir = "migrations"

# Etap 3+: cache katalogu i sesje
# [[kv_namespaces]]
# binding = "CACHE"
# id = "..."

# Pliki klientów (logo, projekty), później zdjęcia produktów i produkty cyfrowe.
[[r2_buckets]]
binding = "FILES"
bucket_name = "promokuznia-files"

[vars]
SHOP_MODE = "demo"   # demo = pasek „Sklep demonstracyjny”, płatności tylko testowe
# Maile (Resend): nadawca z domeny zweryfikowanej w Resend; odpowiedzi klientów trafiają na MAIL_REPLY_TO
MAIL_FROM = "PromoKuźnia <zamowienia@stronyaiwroclaw.pl>"
MAIL_REPLY_TO = "stronyaiwroclaw@gmail.com"
# InPost: "1" = sandbox (sandbox-api-shipx-pl, sandbox Geowidget), "0" = produkcja
INPOST_SANDBOX = "1"
# Cloudflare Turnstile (ochrona formularzy): klucz publiczny tutaj, TURNSTILE_SECRET jako sekret. Pusty = wyłączone.
TURNSTILE_SITE_KEY = ""
